name: Contrôles

# Ce fichier existe à cause d'une panne précise.
#
# Le garde-fou de includes/mailer.php se déclenchait sur lui-même et
# faisait tomber en erreur 500 toutes les pages du portail — l'accueil,
# la connexion, l'administration, les vingt-et-un points d'entrée de
# l'API. Rien ne le signalait : les fichiers étaient syntaxiquement
# corrects, et php -l n'y voyait que du feu.
#
# On ne contrôle donc pas seulement la syntaxe : on monte une vraie base,
# on lance un vrai serveur, et on ouvre vraiment chaque page.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  controler:
    runs-on: ubuntu-latest

    services:
      mariadb:
        # La même version qu'en production, et ce n'est pas un détail :
        # un schéma qui passe sur MySQL 8 peut échouer sur MariaDB 10.11.
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: essai
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v5

      # Un flux de travail dont un bloc run: est mal cité ne se voit
      # qu'à l'exécution — et pour deploiement.yml, cela voudrait dire
      # sur le site en production. Une apostrophe française échappée
      # entre apostrophes simples avale silencieusement la fin du
      # script : c'est exactement ce qui est arrivé ici.
      - name: La syntaxe des flux de travail eux-mêmes
        run: |
          python3 - <<'PY'
          import yaml, subprocess, sys, glob
          mauvais = 0
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              d = yaml.safe_load(open(f, encoding='utf-8'))
              for job in d.get('jobs', {}).values():
                  for i, s in enumerate(job.get('steps', []), 1):
                      if 'run' not in s: continue
                      titre = s.get('name', 'étape %d' % i)
                      r = subprocess.run(['bash', '-n'], input=s['run'],
                                         text=True, capture_output=True)
                      if r.returncode:
                          mauvais += 1
                          print('::error file=%s::%s — %s' % (f, titre, r.stderr.strip()))
                      else:
                          print('  ok  %s · %s' % (f, titre))
          sys.exit(1 if mauvais else 0)
          PY

      # `bash -n`, ci-dessus, ne voit que la syntaxe des scripts. Il ne
      # sait rien des contextes de GitHub — et c'est exactement par là que
      # ce fichier est tombé : un `if: hashFiles(...)` posé sur un TRAVAIL
      # au lieu d'une ÉTAPE fait refuser le flux entier à la validation,
      # en zéro seconde, sans journal, et sans qu'aucun contrôle ne
      # tourne. Quatre envois de suite y sont passés, et les contrôles PHP
      # sont tombés avec.
      #
      # actionlint connaît la table des contextes, les expressions et les
      # actions référencées. C'est la seule chose qui trouve cela.
      #
      # BINAIRE ÉPINGLÉ, EMPREINTE VÉRIFIÉE. On télécharge un exécutable
      # depuis l'extérieur pour le lancer sur ce dépôt : autant savoir
      # lequel. Sans cette vérification, une publication compromise
      # ferait ce qu'elle veut sur la machine d'exécution.
      #
      # shellcheck est désactivé à dessein. Il signale quatre points de
      # style sur des scripts qui existaient avant lui — trois ici, un
      # dans deploiement.yml — et un contrôle qui naît rouge se fait
      # désactiver dans la semaine. La syntaxe des scripts reste couverte
      # par l'étape précédente. À rallumer le jour où ces quatre points
      # seront traités, dans un envoi qui ne fera que cela.
      - name: Les flux de travail passent-ils actionlint ?
        run: |
          # GitHub exécute ce bloc sous `bash -e` : une commande qui échoue
          # interrompt tout sur place. D'où le `|| resultat=$?`, qui laisse
          # le ménage se faire avant de rendre le verdict — un `;` ou un
          # `&&` à cet endroit ne s'exécuterait jamais.
          version=1.7.12
          empreinte=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          archive="actionlint_${version}_linux_amd64.tar.gz"

          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"

          if ! echo "${empreinte}  ${archive}" | sha256sum -c - >/dev/null; then
            echo "::error::L'empreinte d'actionlint ne correspond pas à celle attendue. Rien n'a été exécuté."
            exit 1
          fi

          tar -xzf "$archive" actionlint

          # Sortie par défaut, volontairement. Un gabarit `-format` qui
          # produirait des annotations en ligne sur la revue ne survit pas
          # au passage YAML → shell : les échappements du modèle Go s'y
          # perdent. La sortie normale nomme fichier, ligne, colonne et
          # recopie l'extrait fautif ; elle suffit.
          resultat=0
          ./actionlint -shellcheck= -pyflakes= || resultat=$?

          rm -f "$archive" actionlint

          if [ "$resultat" -ne 0 ]; then
            echo "::error::actionlint a refusé un flux de travail. Rien n'est déposé tant que ce n'est pas corrigé."
            exit "$resultat"
          fi
          echo "$(ls .github/workflows/*.yml | wc -l) flux de travail, rien à signaler."

      - name: La version de PHP
        run: |
          php -v | head -1
          php -r 'exit(version_compare(PHP_VERSION, "8.1", ">=") ? 0 : 1);' \
            || { echo "::error::Il faut PHP 8.1 au minimum."; exit 1; }

      - name: La syntaxe de tous les fichiers PHP
        run: |
          erreurs=0
          while IFS= read -r f; do
            php -l "$f" >/dev/null 2>&1 || { echo "::error file=$f::$(php -l "$f" 2>&1 | head -2 | tail -1)"; erreurs=1; }
          done < <(find . -name '*.php' -not -path './.git/*')
          [ $erreurs -eq 0 ] && echo "$(find . -name '*.php' -not -path './.git/*' | wc -l) fichiers, aucune erreur de syntaxe."
          exit $erreurs

      - name: La syntaxe de tous les fichiers JavaScript
        run: |
          erreurs=0
          while IFS= read -r f; do
            node --check "$f" >/dev/null 2>&1 || { echo "::error file=$f::syntaxe JavaScript"; erreurs=1; }
          done < <(find . -name '*.js' -not -path './.git/*')
          [ $erreurs -eq 0 ] && echo "$(find . -name '*.js' -not -path './.git/*' | wc -l) fichiers, aucune erreur de syntaxe."
          exit $erreurs

      - name: Les schémas se chargent-ils sur MariaDB ?
        run: |
          m() { mysql -h 127.0.0.1 -P 3306 -u root -pessai "$@"; }
          m -e "CREATE DATABASE \`6l3nq9_core\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          m 6l3nq9_core < needhelpapp/sql/schema.sql
          m 6l3nq9_core < needhelpapp/sql/applications.sql
          echo "socle : $(m -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='6l3nq9_core';") tables"
          if [ -f budget/sql/schema.sql ]; then
            m -e "CREATE DATABASE \`6l3nq9_budget\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
            m 6l3nq9_budget < budget/sql/schema.sql
            echo "budget : $(m -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='6l3nq9_budget';") tables"
          fi

      # LE CONTRÔLE QUI COMPTE. Une configuration jetable, un serveur, et
      # chaque page ouverte pour de vrai. Une erreur 500 arrête tout.
      - name: Chaque page du portail répond-elle ?
        run: |
          cat > needhelpapp/config/nha.php <<'PHP'
          <?php
          return ['db_host' => '127.0.0.1', 'db_core' => '6l3nq9_core',
                  'db_user' => 'root', 'db_pass' => 'essai',
                  'diagnostic_jeton' => 'controle', 'purge_jeton' => 'controle'];
          PHP
          # La base d'essai répond-elle ? Sans cette vérification, une
          # base injoignable ferait tomber les quarante-six pages d'un
          # coup et le rapport accuserait le code d'une panne du banc
          # d'essai. On veut un message, pas quarante-six.
          php -r '
            require "needhelpapp/includes/nha-core.php";
            try { nha_db()->query("SELECT 1"); echo "base d\x27essai joignable\n"; }
            catch (Throwable $e) {
              fwrite(STDERR, "::error::La base d\x27essai est injoignable : " . $e->getMessage()
                   . " — c\x27est le banc d\x27essai qui est en cause, pas le code.\n");
              exit(1);
            }'

          php -S 127.0.0.1:8099 -t needhelpapp > /tmp/serveur.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8099/ && break; sleep 0.3; done

          fatales=0; vues=0
          verifier() {
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8099/$1")
            vues=$((vues+1))
            printf '  %-34s %s\n' "$1" "$code"
            [ "$code" = "500" ] && { echo "::error::$1 répond 500"; fatales=$((fatales+1)); }
            return 0
          }
          for f in $(cd needhelpapp && ls *.php); do verifier "$f"; done
          for f in $(cd needhelpapp && ls admin/*.php api/*.php); do verifier "$f"; done

          rm -f needhelpapp/config/nha.php
          if [ $fatales -gt 0 ]; then
            echo "::error::$fatales page(s) en erreur fatale sur $vues."
            # On cherche les erreurs plutôt que d'afficher la fin du
            # journal : la panne est souvent au début, noyée sous les
            # requêtes qui ont suivi.
            # Guillemets doubles : une apostrophe française ne peut pas
            # être échappée entre apostrophes simples en bash, et la
            # tentative avale silencieusement la fin du fichier.
            echo "--- les erreurs, dans l'ordre ---"
            # -a : le journal du serveur contient des octets que grep
            # juge binaires, et il masquerait alors les lignes au moment
            # précis où l'on veut les lire.
            grep -aiE 'fatal error|uncaught' /tmp/serveur.log | sed 's/^/  /' | sort -u | head -20
            exit 1
          fi
          echo "$vues pages et points d'entrée, aucune erreur fatale."

      # Deux listes qui doivent s'accorder finissent par diverger. Celle
      # des rayons vit dans le catalogue du navigateur ET dans le
      # validateur du serveur : quand l'une avance seule, rayonValide()
      # reverse silencieusement les produits dans « Divers », et rien ne
      # le signale.
      - name: Les rayons de familyshop concordent-ils ?
        run: |
          python3 - <<'PY'
          import re, sys
          js = re.findall(r"\{ code:'([a-z]+)'",
                          open('familyshop/assets/ingredients.js', encoding='utf-8').read())
          src = open('familyshop/api/db.php', encoding='utf-8').read()
          bloc = src[src.index('const RAYONS ='):src.index('function rayonValide')]
          php = re.findall(r"'([a-z]+)'", bloc)
          if js == php:
              print('  ok  %d rayons, même ordre des deux côtés' % len(js))
          else:
              print('::error::Les rayons divergent. Navigateur : %s — Serveur : %s' % (js, php))
              sys.exit(1)
          PY

      - name: Le coffre et les échéanciers de budget
        if: hashFiles('budget/api/calcul-test.php') != ''
        run: php budget/api/calcul-test.php

      - name: Aucun secret n'a-t-il été commité ?
        run: |
          trouve=0
          # Les vrais fichiers de configuration ne doivent jamais entrer
          # dans le dépôt : ils portent mots de passe et clé de coffre.
          for interdit in needhelpapp/config/nha.php teaching/api/config.php \
                          familyshop/api/config.php budget/api/config.php; do
            [ -f "$interdit" ] && { echo "::error::$interdit est dans le dépôt."; trouve=1; }
          done
          if grep -rInE '(sk_live_|whsec_)[A-Za-z0-9]{10,}' --include='*.php' --include='*.js' . ; then
            echo "::error::Une clé Stripe semble écrite en dur."; trouve=1
          fi
          [ $trouve -eq 0 ] && echo "Rien de suspect."
          exit $trouve

  # LE MOTEUR DE CONDUITE S'ÉPROUVE SANS ANDROID, ET C'EST TOUT L'INTÉRÊT.
  #
  # Décider si l'on conduit est le morceau où une erreur coûte le plus
  # cher, dans les deux sens : ne pas bloquer un conducteur rate la
  # raison d'être de l'application, bloquer un piéton la fait
  # désinstaller. Ce morceau a donc été écrit sans la moindre référence
  # à Android — ni SDK, ni émulateur, ni téléphone — pour qu'il se
  # rejoue ici, en quelques secondes, à chaque envoi.
  #
  # L'application Android, elle, n'est pas compilée par ce flux : cela
  # demanderait de télécharger le SDK à chaque exécution. C'est un choix
  # assumé — on éprouve la logique, pas l'assemblage.
  # PAS DE `if:` SUR CE TRAVAIL, et c'est une leçon payée cher.
  #
  # Il portait `if: hashFiles('conduite/moteur/build.gradle.kts') != ''`,
  # par prudence. Or `hashFiles` n'est utilisable que dans un `if:`
  # d'ÉTAPE, jamais d'un travail — GitHub refuse alors le fichier entier
  # à la validation, avant d'exécuter quoi que ce soit. Résultat : quatre
  # envois de suite marqués en échec en zéro seconde, sans le moindre
  # journal, ET les contrôles PHP qui ne tournaient plus non plus.
  #
  # Le garde-fou était de toute façon inutile : le dossier est dans le
  # dépôt. `bash -n` sur les blocs `run:` ne voit pas ce genre d'erreur ;
  # seul `actionlint` la trouve.
  moteur-conduite:
    name: Le moteur de détection de conduite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Les scénarios de conduite
        working-directory: conduite
        run: ./gradlew -p moteur test --console=plain

      - name: Le rapport, en cas d'échec
        if: failure()
        working-directory: conduite/moteur
        run: |
          for f in build/reports/tests/test/classes/*.html; do
            [ -f "$f" ] && echo "--- $f" && sed -e 's/<[^>]*>//g' "$f" | grep -v '^\s*$' | head -60
          done

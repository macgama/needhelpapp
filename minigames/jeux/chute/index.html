<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chute — Machines</title>
<meta name="description" content="Lâchez des tuiles dans la chute, fusionnez les valeurs identiques, déclenchez des cascades avant que la montée ne vous rattrape.">
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../css/arcade.css">
<link rel="stylesheet" href="chute.css">
</head>
<body>
<main class="cabinet">

  <nav class="topbar"><a class="back" href="../../index.html">‹ Toutes les machines</a></nav>

  <header class="head">
    <h1 class="mark">Chute</h1>
    <p class="tag">Vise. Lâche. Fusionne.</p>
  </header>

  <section class="readout" aria-label="Tableau de bord">
    <div class="stat">
      <span class="lab">Score</span>
      <b class="val" id="score" aria-live="polite">0</b>
    </div>
    <div class="stat">
      <span class="lab">Record</span>
      <b class="val" id="best">0</b>
    </div>
    <div class="stat stat--next">
      <span class="lab">Suivant</span>
      <div class="chip" id="next" aria-label="Prochaine tuile"></div>
    </div>
  </section>

  <div class="meter" id="meter">
    <div class="meter-head">
      <span class="lab" id="meterLab">Montée · palier 1</span>
      <span class="lab meter-left" id="meterLeft">14 coups</span>
    </div>
    <div class="meter-track"><i id="meterFill"></i></div>
  </div>

  <div class="stage">
    <div class="rail" aria-hidden="true"></div>
    <div class="screen playfield" id="playfield">
      <div class="guide" id="guide" aria-hidden="true"><i></i></div>
      <div class="grid" id="cells" aria-hidden="true"></div>
      <div class="layer" id="tiles"></div>
      <div class="combo" id="combo" hidden></div>
      <div class="over" id="over" hidden>
        <p class="over-kicker">Chute bouchée</p>
        <p class="over-score" id="overScore">0</p>
        <p class="over-note" id="overNote">Plus haute tuile : 2</p>
        <button class="btn btn--main" id="again" type="button">Rejouer</button>
      </div>
    </div>
    <div class="rail" aria-hidden="true"></div>
  </div>

  <div class="pad">
    <button class="btn" id="left" type="button" aria-label="Colonne de gauche">◀</button>
    <button class="btn btn--main" id="drop" type="button">Lâcher</button>
    <button class="btn" id="right" type="button" aria-label="Colonne de droite">▶</button>
  </div>

  <p class="help">Flèches ou <kbd>A</kbd>/<kbd>D</kbd> pour viser · <kbd>Espace</kbd> pour lâcher · ou touchez une colonne. Tous les
    quelques coups, une rangée pousse par le bas.</p>

  <div class="foot">
    <button class="ghost" id="restart" type="button">Nouvelle partie</button>
    <button class="ghost" id="mute" type="button" aria-pressed="false">Son : actif</button>
  </div>

</main>
<script src="../../js/arcade.js"></script>
<script src="chute.js"></script>
</body>
</html>
